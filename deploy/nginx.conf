# 云服务器上的反向代理 + HTTPS
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/aqa
#   sudo ln -s /etc/nginx/sites-available/aqa /etc/nginx/sites-enabled/aqa
#   sudo certbot --nginx -d qa.example.com     # 自动填充 ssl_certificate 两行
#   sudo nginx -t && sudo nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name qa.example.com;   # 改成你的域名；没有域名就先用 http://<公网IP>

    # certbot 会把这行改成 301 跳转，证书签好后整个站点就走 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # GitHub webhook 需要这几个头才能正确回调
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流水线单次可能跑几分钟，别让网关提前掐断（webhook 接口本身是秒回 202）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # push payload 上限 2MB，和 api.py 里的 MAX_BODY 对齐
        client_max_body_size 2m;
    }
}
